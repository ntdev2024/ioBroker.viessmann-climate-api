name: Test and Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: "22.x"
          lint: true

  adapter-tests:
    needs: check-and-lint
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ${{ matrix.os }}
    env:
      IOBROKER_TEST_CONTROLLER_VERSION: ${{ matrix.node.controller_version }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - node_version: 22.x
            controller_version: 7.2.3
          - node_version: 24.x
            controller_version: 7.2.3
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node.node_version }}
          os: ${{ matrix.os }}

  # npm deployment remains intentionally disabled until an explicitly
  # approved trusted-publishing setup is complete.
